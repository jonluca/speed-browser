nodeLinker: hoisted
minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyExclude:
  - "semver@6.3.1"

packageExtensions:
  eslint-plugin-react-compiler@*:
    peerDependenciesMeta:
      eslint:
        optional: true

minimumReleaseAgeExclude:
  # Expo 56 is intentionally allowlisted while this app is brought up on Palate's exact stack.
  - "@expo/cli"
  - "@expo/expo-modules-macros-plugin"
  - "@expo/log-box"
  - "@expo/metro-config"
  - "@expo/metro-runtime"
  - "@expo/router-server"
  - "@expo/ui"
  - "@expo/vector-icons"
  - "@expo/ws-tunnel"
  - "@types/node"
  - "@types/react"
  - "@typescript/native-preview"
  - "babel-preset-expo"
  - "expo"
  - "expo-asset"
  - "expo-blur"
  - "expo-build-properties"
  - "expo-clipboard"
  - "expo-constants"
  - "expo-file-system"
  - "expo-font"
  - "expo-haptics"
  - "expo-image"
  - "expo-linking"
  - "expo-modules-core"
  - "expo-modules-jsi"
  - "expo-router"
  - "expo-sharing"
  - "expo-splash-screen"
  - "expo-sqlite"
  - "expo-status-bar"
  - "expo-symbols"
  - "expo-system-ui"
  # Toolchain/browser data packages released inside the seven-day window.
  - "@oxlint/binding-android-arm-eabi"
  - "@oxlint/binding-android-arm64"
  - "@oxlint/binding-darwin-arm64"
  - "@oxlint/binding-darwin-x64"
  - "@oxlint/binding-freebsd-x64"
  - "@oxlint/binding-linux-arm-gnueabihf"
  - "@oxlint/binding-linux-arm-musleabihf"
  - "@oxlint/binding-linux-arm64-gnu"
  - "@oxlint/binding-linux-arm64-musl"
  - "@oxlint/binding-linux-ppc64-gnu"
  - "@oxlint/binding-linux-riscv64-gnu"
  - "@oxlint/binding-linux-riscv64-musl"
  - "@oxlint/binding-linux-s390x-gnu"
  - "@oxlint/binding-linux-x64-gnu"
  - "@oxlint/binding-linux-x64-musl"
  - "@oxlint/binding-openharmony-arm64"
  - "@oxlint/binding-win32-arm64-msvc"
  - "@oxlint/binding-win32-ia32-msvc"
  - "@oxlint/binding-win32-x64-msvc"
  - "acorn"
  - "baseline-browser-mapping"
  - "caniuse-lite"
  - "dnssd-advertise"
  - "electron-to-chromium"
  - "eslint"
  - "oxfmt"
  - "oxlint"
  - "react-native-drawer-layout"
  - "react-native-worklets"
  - "regjsparser"
  - "semver"
